<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>時間割カレンダー</title>

<style>
body {
  font-family: sans-serif;
  margin: 10px;
}

h1 {
  text-align: center;
}

.controls {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

button {
  padding: 5px 10px;
}

select {
  padding: 5px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #ccc;
  vertical-align: top;
  height: 100px;
  padding: 4px;
  font-size: 12px;
}

th {
  background: #f0f0f0;
}

.date {
  font-weight: bold;
}

.today {
  background: #fff3cd;
}

.class {
  background: #e3f2fd;
  margin: 2px 0;
  padding: 2px;
  border-radius: 3px;
  font-size: 11px;
}

.comment {
  color: red;
  font-size: 11px;
}

.back-link {
  margin-bottom: 10px;
  display: inline-block;
}

@media (max-width: 600px) {
  th, td {
    font-size: 10px;
    height: 80px;
  }
}
</style>
</head>

<body>

<a href="index.html" class="back-link">← トップへ戻る</a>

<h1 id="title"></h1>

<div class="controls">
  <div>
    <button onclick="prevMonth()">← 前月</button>
    <button onclick="nextMonth()">次月 →</button>
  </div>

  <div>
    学年:
    <select id="gradeSelect" onchange="render()"></select>
  </div>
</div>

<table>
<thead>
<tr>
  <th>日</th><th>月</th><th>火</th>
  <th>水</th><th>木</th><th>金</th><th>土</th>
</tr>
</thead>
<tbody id="calendarBody"></tbody>
</table>

<script>
let allData = [];
let currentDate = new Date();
let selectedGrade = "";

// JSON読み込み
fetch("schedule.json")
  .then(res => res.json())
  .then(data => {
    allData = data;
    initGradeSelector();
    render();
  });

// 学年
function initGradeSelector() {
  const grades = ["1年","2年","3年","4年","助産","M1","M2","D1","D2/D3"];
  const select = document.getElementById("gradeSelect");
  select.innerHTML = "";

  grades.forEach((g, index) => {
    const opt = document.createElement("option");
    opt.value = g;
    opt.text = g;
    select.appendChild(opt);

    if(index === 0){
      select.value = g;
      selectedGrade = g;
    }
  });
}

// 描画
function render() {
  const tbody = document.getElementById("calendarBody");
  tbody.innerHTML = "";

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  document.getElementById("title").innerText =
    `${year}年 ${month + 1}月`;

  selectedGrade = document.getElementById("gradeSelect").value;

  let data = allData.filter(d => {
    let g = d.grade;

    if(["1","2","3","4"].includes(g)) g = g + "年";

    if(selectedGrade === "D2/D3") {
      return g === "D2" || g === "D3";
    }

    return g === selectedGrade;
  });

  const monthStr = `${year}-${String(month+1).padStart(2,"0")}`;
  data = data.filter(d => d.date.startsWith(monthStr));

  const map = {};
  data.forEach(d => {
    if (!map[d.date]) map[d.date] = [];
    map[d.date].push(d);
  });

  const firstDay = new Date(year, month, 1);
  const lastDate = new Date(year, month + 1, 0).getDate();

  let row = document.createElement("tr");

  for (let i = 0; i < firstDay.getDay(); i++) {
    row.appendChild(document.createElement("td"));
  }

  for (let date = 1; date <= lastDate; date++) {
    const cell = document.createElement("td");
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(date).padStart(2,"0")}`;

    const today = new Date();
    if (
      today.getFullYear() === year &&
      today.getMonth() === month &&
      today.getDate() === date
    ) {
      cell.classList.add("today");
    }

    const dateDiv = document.createElement("div");
    dateDiv.className = "date";
    dateDiv.innerText = date;
    cell.appendChild(dateDiv);

    const dayData = map[dateStr] || [];
    dayData.sort((a, b) => Number(a.period) - Number(b.period));

    dayData.forEach(d => {
      const periodNum = Number(d.period);

      if(periodNum === 0){
        const c = document.createElement("div");
        c.className = "comment";
        c.innerText = d.comment;
        cell.appendChild(c);
      } else {
        const c = document.createElement("div");
        c.className = "class";

        const subject = d.courses || "科目不明";
        const room = (d.room !== undefined && d.room !== null) ? String(d.room) : "";

        c.innerText = room
          ? `${periodNum}限 ${subject}（${room}）`
          : `${periodNum}限 ${subject}`;

        cell.appendChild(c);
      }
    });

    row.appendChild(cell);

    if(new Date(year, month, date).getDay() === 6){
      tbody.appendChild(row);
      row = document.createElement("tr");
    }
  }

  tbody.appendChild(row);
}

// 月切り替え
function prevMonth(){
  currentDate.setMonth(currentDate.getMonth() - 1);
  render();
}

function nextMonth(){
  currentDate.setMonth(currentDate.getMonth() + 1);
  render();
}
</script>

</body>
</html>
